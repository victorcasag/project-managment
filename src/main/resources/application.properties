spring.application.name=victorapi

spring.datasource.url=jdbc:postgresql://localhost:5432/victorapi_db
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.springframework.web=INFO
logging.level.org.springdoc=DEBUG
logging.level.modules=DEBUG

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=br.edu.infnet.victorapi
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.filter=true
logging.level.org.springframework.security=DEBUG
api.security.token.secret=mySecretKey123456789012345678901234567890
api.security.token.expiration=86400000
api.security.refresh.expiration=604800000

# Jackson Configuration para Java 21
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# Date/Time Format para Java 21 LocalDateTime
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false
spring.jackson.deserialization.read-date-timestamps-as-nanoseconds=false

# Formato de data/hora (opcional)
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo

# JSON Pretty Print (apenas para desenvolvimento)
spring.jackson.serialization.indent-output=true

# Configuração adicional para Java 21
spring.jackson.mapper.default-view-inclusion=true