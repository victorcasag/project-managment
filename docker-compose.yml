version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: victorapi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: victorapi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d victorapi_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  rabbitmq:
    image: rabbitmq:3-management
    container_name: victorapi_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app_network

  config-server:
    build: ./config-server
    container_name: victorapi_config_server
    ports:
      - "8888:8888"
    networks:
      - app_network

  discovery-server:
    build: ./discovery-server
    container_name: victorapi_discovery
    ports:
      - "8761:8761"
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:latest
    container_name: victorapi_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - app_network

  grafana:
    image: grafana/grafana:latest
    container_name: victorapi_grafana
    ports:
      - "3000:3000"
    networks:
      - app_network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  app_network:
    driver: bridge